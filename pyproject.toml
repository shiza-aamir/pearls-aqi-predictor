[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "pearls-aqi-predictor"
version = "0.1.0"
description = "End-to-end AQI forecasting and MLOps platform"
requires-python = ">=3.11,<3.12"

dependencies = [
    "numpy==2.4.6",
    "pandas==2.3.3",
    "scipy==1.17.1",
    "scikit-learn==1.9.0",
    "xgboost==3.2.0",
    "mlflow==3.15.2",
    "feast==0.66.0",
    "shap==0.51.0",
    "matplotlib==3.11.1",
    "pyarrow==25.0.1",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "requests==2.34.2",
    "httpx==0.28.1",
    "python-dotenv==1.2.3",
]


[project.optional-dependencies]
training = [
    "tensorflow==2.21.0",
]

dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
    "black==26.5.1",
    "mypy==2.3.1",
]

full = [
    "tensorflow==2.21.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
    "black==26.5.1",
    "mypy==2.3.1",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "B008",
    "BLE001",
    "RUF012",
]


[tool.black]
line-length = 100


[tool.mypy]
python_version = "3.11"
strict = true