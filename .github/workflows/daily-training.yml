name: Daily AQI Training

on:
  schedule:
    - cron: "37 1 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-aqi-training
  cancel-in-progress: false

jobs:
  daily-training:
    name: Train daily XGBoost candidates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install training dependencies
        run: pip install -e ".[mlops]"

      - name: Verify training data exists
        run: |
          test -f data/splits/expanded/fold_3/train.parquet
          test -f data/splits/expanded/fold_3/validation.parquet

      - name: Run protected daily training
        run: python -m pipelines.daily_training_pipeline

      - name: Upload daily training report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-aqi-training-${{ github.run_number }}
          path: |
            artifacts/daily_training/
            mlflow.db
            mlruns/
          if-no-files-found: warn
          retention-days: 7