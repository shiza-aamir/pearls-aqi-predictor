name: Hourly AQI Feature Pipeline

on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-aqi-feature-pipeline
  cancel-in-progress: false

jobs:
  hourly-feature-pipeline:
    name: Generate hourly AQI forecasts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      AQICN_API_TOKEN: ${{ secrets.AQICN_API_TOKEN }}
      MODEL_SOURCE: bundled

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install serving dependencies
        run: |
          pip install -e .
          pip install pyarrow==25.0.1

      - name: Restore hourly history cache
        uses: actions/cache@v5
        with:
          path: data/live/history
          key: aqi-live-history-${{ github.run_id }}
          restore-keys: |
            aqi-live-history-

      - name: Run hourly production pipeline
        run: python -m pipelines.hourly_prediction_pipeline